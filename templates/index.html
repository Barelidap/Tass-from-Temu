<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TASS from Temu</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='/css/style.css') }}"
    >
</head>

<body>
    <header class="header">
        <h1>TASS from Temu</h1>

        <p class="subtitle">
            Shitty real-time retail analytics
        </p>
    </header>

    <main class="main">
        <section class="dashboard">
            <div class="video-container">
                <img
                    class="video-stream"
                    src="/video-feed"
                    alt="Live camera stream"
                >
            </div>

            <aside class="statistics-panel">
                <div class="statistics-heading">
                    <div>
                        <h2>Completed visits</h2>

                        <p>
                            Updates after a visitor leaves the frame
                            for more than two seconds.
                        </p>
                    </div>

                    <span
                        id="connection-status"
                        class="connection-status"
                    >
                        Connecting
                    </span>
                </div>

                <div class="stat-card stat-card-main">
                    <span class="stat-label">
                        Total visitors
                    </span>

                    <strong
                        id="total-visits"
                        class="stat-value"
                    >
                        0
                    </strong>
                </div>

                <div class="statistics-grid">
                    <div class="stat-card">
                        <span class="stat-label">
                            Average duration
                        </span>

                        <strong
                            id="average-duration"
                            class="stat-value"
                        >
                            0.0 s
                        </strong>
                    </div>

                    <div class="stat-card">
                        <span class="stat-label">
                            Male
                        </span>

                        <strong
                            id="male-visits"
                            class="stat-value"
                        >
                            0
                        </strong>
                    </div>

                    <div class="stat-card">
                        <span class="stat-label">
                            Female
                        </span>

                        <strong
                            id="female-visits"
                            class="stat-value"
                        >
                            0
                        </strong>
                    </div>

                    <div class="stat-card">
                        <span class="stat-label">
                            Unknown gender
                        </span>

                        <strong
                            id="unknown-gender-visits"
                            class="stat-value"
                        >
                            0
                        </strong>
                    </div>
                </div>

                <div class="age-section">
                    <h3>Age groups</h3>

                    <div id="age-groups" class="age-groups">
                        <p class="empty-message">
                            No completed visits yet.
                        </p>
                    </div>
                </div>
            </aside>
        </section>
    </main>

    <script src="{{ url_for('static', path='/js/dashboard.js') }}"></script>
</body>
</html>
